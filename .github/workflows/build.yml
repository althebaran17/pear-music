name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: unzip -q Pear-Music-0.3.5-android10.zip
      - run: cd Pear-Music-0.3.5 && chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PearMusic-apk
          path: Pear-Music-0.3.5/app/build/outputs/apk/release/*.apk
